<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomMind</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <strong>RoomMind</strong>
        <span>感知台</span>
      </div>
    </div>
    <p id="link-status" class="link">正在检查感知服务</p>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="source-title">
      <div class="card-head">
        <h1 id="source-title">画面</h1>
        <div class="segment" role="tablist" aria-label="画面来源">
          <button type="button" id="tab-camera" role="tab" aria-selected="true" aria-controls="pane-camera">摄像头</button>
          <button type="button" id="tab-upload" role="tab" aria-selected="false" aria-controls="pane-upload">上传图片</button>
        </div>
      </div>

      <div id="pane-camera" role="tabpanel">
        <div class="fields">
          <label>设备
            <select id="camera-source"></select>
          </label>
          <label>宽度
            <input id="camera-width" type="number" min="160" max="3840" value="1920">
          </label>
          <label>高度
            <input id="camera-height" type="number" min="120" max="2160" value="1080">
          </label>
        </div>
        <div class="actions">
          <button type="button" id="camera-refresh" class="ghost">刷新设备</button>
          <button type="button" id="camera-toggle">打开预览</button>
        </div>
        <p id="camera-note" class="note">实时预览只显示画面，不运行推理。</p>
        <div class="stage" id="camera-stage">
          <img id="camera-view" alt="">
          <p id="camera-empty">尚未打开摄像头</p>
        </div>
        <dl class="stats" id="camera-stats" hidden>
          <div><dt>分辨率</dt><dd id="stat-size">—</dd></div>
          <div><dt>设备帧率</dt><dd id="stat-fps">—</dd></div>
          <div><dt>输出帧率</dt><dd id="stat-measured">—</dd></div>
          <div><dt>编码</dt><dd id="stat-fourcc">—</dd></div>
          <div><dt>设备</dt><dd id="stat-source">—</dd></div>
          <div><dt>预览上限</dt><dd id="stat-cap">—</dd></div>
        </dl>
      </div>

      <div id="pane-upload" role="tabpanel" hidden>
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/*">
          <span id="drop-label">选择或拖入一张图片</span>
        </label>
        <div class="stage" id="upload-stage" hidden>
          <img id="upload-view" alt="待推理图片">
        </div>
      </div>
    </section>

    <section class="card" aria-labelledby="run-title">
      <div class="card-head">
        <h1 id="run-title">推理</h1>
        <div class="segment" role="radiogroup" aria-label="推理服务">
          <button type="button" class="svc" data-service="vlm" aria-pressed="true">VLM</button>
          <button type="button" class="svc" data-service="dino" aria-pressed="false">DINO</button>
          <button type="button" class="svc" data-service="sam" aria-pressed="false">SAM</button>
          <button type="button" class="svc" data-service="all" aria-pressed="false">顺序全部</button>
        </div>
      </div>
      <p id="run-hint" class="note">上传图片后选择服务。顺序全部按 VLM → DINO → SAM 运行，上一步失败会停下。</p>

      <fieldset id="fields-vlm">
        <legend>VLM</legend>
        <label>提示词
          <textarea id="vlm-prompt" rows="2">描述这些物体在画面中的位置和状态。</textarea>
        </label>
        <div class="fields">
          <label>时间
            <input id="vlm-time" type="datetime-local">
          </label>
          <label>位置
            <input id="vlm-location" type="text" value="客厅">
          </label>
        </div>
        <label>物体，用顿号或逗号分开
          <textarea id="vlm-objects" rows="2" placeholder="例如：穿粉色衣服的小女孩、饮水机"></textarea>
        </label>
      </fieldset>

      <fieldset id="fields-dino" hidden>
        <legend>DINO</legend>
        <label>英文短语，用句号分隔
          <input id="dino-prompt" type="text" value="a chair. a sofa. a table.">
        </label>
      </fieldset>

      <fieldset id="fields-sam" hidden>
        <legend>SAM</legend>
        <div class="fields">
          <label>每边点数
            <input id="points-crop" type="number" min="1" max="32" value="16">
          </label>
          <label>每批点数
            <input id="points-batch" type="number" min="1" max="64" value="8">
          </label>
        </div>
        <p class="note">采样点数 <strong id="point-total">256</strong>，等于每边点数的平方。8GB 板上每边 16、每批 8 是稳妥起点，显存不够就把每批降到 4。</p>
      </fieldset>

      <div class="actions">
        <button type="button" id="run" disabled>运行</button>
      </div>
    </section>
  </main>

  <section id="results" class="results" aria-live="polite"></section>
  <script src="/app.js"></script>
</body>
</html>
