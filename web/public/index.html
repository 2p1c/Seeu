<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RoomMind</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <strong>RoomMind</strong>
        <span>感知流水线</span>
      </div>
    </div>
    <nav id="nav" class="navs"></nav>
    <p id="link-status" class="link">正在检查感知服务</p>
  </header>

  <main class="layout">
    <section class="card" aria-labelledby="source-title">
      <div class="card-head">
        <h1 id="source-title">输入</h1>
      </div>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*">
        <span id="drop-label">选择或拖入一张图片</span>
      </label>
      <div class="stage" id="preview-stage" hidden>
        <img id="preview" alt="待处理图片">
      </div>
      <div class="actions">
        <button type="button" id="run" disabled>开始处理</button>
        <button type="button" id="last-run">上次结果</button>
      </div>
      <p class="note">同一张图依次做分割、分类、向量和描述。处理过程中会显示当前阶段。</p>
    </section>

    <section class="card" aria-labelledby="phase-title">
      <div class="card-head">
        <h1 id="phase-title">处理阶段</h1>
      </div>
      <p id="phase-status" class="status">等待图片</p>
      <ol id="phases" class="phases"></ol>
    </section>
  </main>

  <section id="results" class="results" hidden>
    <article class="result">
      <h2>处理后的图像</h2>
      <p id="frame-meta" class="meta"></p>
      <div class="shots">
        <figure>
          <img id="result-image" alt="画了物体框的结果图">
          <figcaption id="result-caption">框和类别来自这张图的物体列表</figcaption>
        </figure>
      </div>
      <p id="result-missing" class="note" hidden>这次没有返回结果图。</p>
    </article>
    <article class="result">
      <h2>物体</h2>
      <p id="object-empty" class="note" hidden>这张图没有留下物体。</p>
      <div id="object-list" class="objects"></div>
    </article>
  </section>
  <script src="/nav.js"></script>
  <script src="/app.js"></script>
</body>
</html>
