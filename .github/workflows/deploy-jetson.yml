# ubuntu-latest joins the tailnet, then rsyncs this checkout to the Jetson
# over its Tailscale address. Create a reusable auth key in the Tailscale admin
# console and store it as TAILSCALE_AUTHKEY. JETSON_SSH_KEY is the deploy key.
name: Deploy to Jetson

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: jetson-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync to Jetson Orin Nano
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DEPLOY_HOST: nano0@100.67.56.41
      DEPLOY_DIR: /home/nano0/Projects/RoomMind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          ping: "100.67.56.41"

      - name: Sync repository
        env:
          SSH_KEY: ${{ secrets.JETSON_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 100.67.56.41 >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.git/' \
            --exclude 'models/' \
            --exclude 'tests/tmp/' \
            --exclude 'roomind.egg-info/' \
            --exclude '.venv/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            ./ "${DEPLOY_HOST}:${DEPLOY_DIR}/"
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_HOST" \
            "DEPLOY_DIR='$DEPLOY_DIR' bash -s" <<'EOF'
          set -euo pipefail
          cd "$DEPLOY_DIR"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "git fetch attempt ${attempt}"
            if git fetch origin main; then
              ok=1
              break
            fi
            echo "attempt ${attempt} failed, retry in 15s"
            sleep 15
          done
          test "$ok" -eq 1
          git reset --hard origin/main
          git log -1 --oneline
          git status -sb
          EOF
